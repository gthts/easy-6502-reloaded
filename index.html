<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Easy 6502 Reloaded</title>
  <meta name="description" content="Learn 6502 assembly in the browser: tutorial, editor, emulator with debugger, monitor and reference. Lernumgebung für 6502-Assembler im Browser.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%231f6feb%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27monospace%27 font-size=%2714%27 font-weight=%27bold%27 text-anchor=%27middle%27 fill=%27white%27%3E65%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="src/ui/styles.css">
  <script type="module" src="src/ui/main.js"></script>
</head>
<body>
<div id="file-warning" hidden style="padding:12px 16px;background:#fff1c2;color:#4a3800;border-bottom:1px solid #d9b100;font:14px/1.5 system-ui,sans-serif"></div>
<script>
  // Browser blockieren Module, die aus dem Dateisystem (file://) geladen werden. Statt einer leeren Seite einen Hinweis zeigen.
  if (location.protocol === 'file:') {
    var de = (navigator.language || '').slice(0, 2) === 'de';
    var box = document.getElementById('file-warning');
    box.textContent = de
      ? 'Diese Seite lässt sich nicht per Doppelklick auf die Datei öffnen, weil der Browser dann ihre Programmteile blockiert. Starten Sie start.cmd im Projektordner (oder „node tools/serve.mjs“) und öffnen Sie http://127.0.0.1:8080/.'
      : 'This page cannot be opened by double-clicking the file because the browser blocks its modules then. Run start.cmd in the project folder (or "node tools/serve.mjs") and open http://127.0.0.1:8080/.';
    box.hidden = false;
  }
</script>
<header class="topbar">
  <h1 class="brand">Easy 6502 Reloaded</h1>
  <div class="toolbar" role="toolbar">
    <button id="btn-assemble" type="button" data-i18n-title="tip.assemble" data-i18n="btn.assemble"></button>
    <button id="btn-run" type="button" class="primary" data-i18n="btn.run"></button>
    <button id="btn-step" type="button" data-i18n-title="tip.step" data-i18n="btn.step"></button>
    <button id="btn-over" type="button" data-i18n-title="tip.stepOver" data-i18n="btn.stepOver"></button>
    <button id="btn-out" type="button" data-i18n-title="tip.stepOut" data-i18n="btn.stepOut"></button>
    <button id="btn-reset" type="button" data-i18n-title="tip.reset" data-i18n="btn.reset"></button>
    <label class="field"><span data-i18n="speed.label"></span>
      <select id="speed" data-i18n-title="tip.speed"></select>
    </label>
  </div>
  <div class="spacer"></div>
  <button id="btn-about" type="button" data-i18n="about.open"></button>
  <label class="field"><span data-i18n="theme.label"></span>
    <select id="theme">
      <option value="auto" data-i18n="theme.auto"></option>
      <option value="light" data-i18n="theme.light"></option>
      <option value="dark" data-i18n="theme.dark"></option>
    </select>
  </label>
  <label class="field"><span data-i18n="lang.label"></span>
    <select id="lang"></select>
  </label>
</header>

<main id="app">
  <aside id="panel-left" class="side side-l" aria-labelledby="title-left">
    <div class="side-head">
      <h2 id="title-left" data-i18n="panel.tutorial"></h2>
      <button type="button" class="tog" data-toggle="left" data-i18n-title="panel.collapse" data-i18n-label="panel.collapse" aria-expanded="true">‹</button>
    </div>
    <div class="side-body tut">
      <div class="tut-nav">
        <select id="tut-select" data-i18n-label="tutorial.chapter"></select>
        <div id="tut-marks" class="marks" role="group" data-i18n-label="tutorial.marks"></div>
        <input id="tut-search" type="search" spellcheck="false" autocomplete="off" data-i18n-placeholder="tutorial.search" data-i18n-label="tutorial.search">
        <ul id="tut-results" class="tut-results"></ul>
      </div>
      <div id="tut-scroll" class="tut-scroll">
        <p id="tut-error" class="err-text" hidden data-i18n="tutorial.loadError"></p>
        <article id="tut-content" class="prose"></article>
        <div class="tut-pager">
          <button id="tut-prev" type="button" data-i18n-title="tutorial.prev" data-i18n-label="tutorial.prev">‹</button>
          <span id="tut-pos" class="muted"></span>
          <button id="tut-next" type="button" data-i18n-title="tutorial.next" data-i18n-label="tutorial.next">›</button>
        </div>
        <p class="muted small credit"><span data-i18n="tutorial.credit"></span>
          <a href="https://skilldrick.github.io/easy6502/" target="_blank" rel="noopener noreferrer">Easy 6502</a> ·
          <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">CC BY 4.0</a></p>
      </div>
    </div>
    <div class="rail-label" aria-hidden="true" data-i18n="panel.tutorial"></div>
  </aside>
  <div class="splitter" id="split-left" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-label="panel.resize"></div>

  <section class="center">
    <article class="card" id="editor-card">
      <div class="card-head">
        <h2 data-i18n="panel.editor"></h2>
        <div class="card-tools">
          <label class="field"><span data-i18n="editor.slot"></span><select id="slot"></select></label>
          <button id="slot-save" type="button" data-i18n="editor.slotSave"></button>
          <button id="slot-load" type="button" data-i18n="editor.slotLoad"></button>
          <span class="sep" aria-hidden="true"></span>
          <select id="example-sel" data-i18n-label="examples.label" data-i18n-title="examples.label"></select>
          <span class="sep" aria-hidden="true"></span>
          <button id="file-open" type="button" data-i18n="editor.fileOpen"></button>
          <button id="file-save" type="button" data-i18n="editor.fileSave"></button>
          <input id="file-input" type="file" accept=".asm,.s,.txt,text/plain" hidden>
        </div>
      </div>
      <div class="editor" id="editor">
        <div class="gutter" id="gutter" aria-hidden="true"><div class="gutter-in"></div></div>
        <div class="ed-main">
          <pre class="layer" id="layer" aria-hidden="true"><code></code></pre>
          <textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off" data-i18n-label="editor.label"></textarea>
        </div>
      </div>
      <p id="editor-note" class="muted small" aria-live="polite"></p>
      <ul id="messages" class="messages" aria-live="polite"></ul>
    </article>
    <div class="vsplit" id="vsplit-editor" role="separator" aria-orientation="horizontal" tabindex="0" data-i18n-label="layout.resizeVertical" data-i18n-title="layout.resizeVerticalTip"></div>

    <div class="pair">
      <article class="card">
        <h2 data-i18n="panel.flow"></h2>
        <div class="flow-bar">
          <label class="field"><span data-i18n="flow.target"></span>
            <input id="flow-target" class="mono" size="9" spellcheck="false" autocomplete="off" data-i18n-placeholder="monitor.gotoHint">
          </label>
          <select id="flow-labels" data-i18n-label="flow.pickLabel"></select>
          <button id="flow-jump" type="button" data-i18n="flow.jump" data-i18n-title="flow.jumpTip"></button>
          <button id="flow-bp" type="button" data-i18n="flow.bp" data-i18n-title="flow.bpTip"></button>
          <button id="flow-prev" type="button" data-i18n-title="flow.prev" data-i18n-label="flow.prev">▲</button>
          <button id="flow-next" type="button" data-i18n-title="flow.next" data-i18n-label="flow.next">▼</button>
        </div>
        <div id="flow" class="mono flow" role="list"></div>
        <p id="flow-note" class="small err-text" aria-live="polite"></p>
        <p class="muted small" data-i18n="flow.bpHint"></p>
      </article>
      <div class="stack">
        <article class="card">
          <h2 data-i18n="panel.screen"></h2>
          <div id="screen-wrap" class="screen-wrap" tabindex="0">
            <canvas id="screen" width="32" height="32" role="img" data-i18n-label="screen.label"></canvas>
          </div>
          <p class="muted small" data-i18n="screen.hint"></p>
        </article>
        <article class="card">
          <h2 data-i18n="panel.registers"></h2>
          <dl id="regs" class="mono regs"></dl>
        </article>
      </div>
    </div>

    <div class="vsplit" id="vsplit-flow" role="separator" aria-orientation="horizontal" tabindex="0" data-i18n-label="layout.resizeVertical" data-i18n-title="layout.resizeVerticalTip"></div>

    <div class="pair md">
    <article class="card">
      <h2 data-i18n="panel.monitor"></h2>
      <div class="monitor-bar">
        <label class="field"><span data-i18n="monitor.goto"></span>
          <input id="mon-goto" class="mono" size="9" spellcheck="false" autocomplete="off" data-i18n-placeholder="monitor.gotoHint" value="$0200">
        </label>
        <button id="mon-prev" type="button" data-i18n-title="monitor.prev" data-i18n-label="monitor.prev">▲</button>
        <button id="mon-next" type="button" data-i18n-title="monitor.next" data-i18n-label="monitor.next">▼</button>
        <span class="sep" aria-hidden="true"></span>
        <label class="field"><span data-i18n="monitor.find"></span>
          <input id="mon-find" class="mono" size="16" spellcheck="false" autocomplete="off" data-i18n-placeholder="monitor.findHint">
        </label>
        <button id="mon-find-btn" type="button" data-i18n="monitor.find"></button>
        <button id="mon-find-next" type="button" data-i18n="monitor.findNext"></button>
        <span id="mon-note" class="small muted" aria-live="polite"></span>
      </div>
      <div id="monitor" class="mono monitor" tabindex="0"></div>
      <p class="muted small" data-i18n="monitor.editHint"></p>
    </article>

    <article class="card">
      <h2 data-i18n="panel.disasm"></h2>
      <div class="flow-bar">
        <label class="field"><span data-i18n="flow.target"></span>
          <input id="dis-goto" class="mono" size="9" spellcheck="false" autocomplete="off" data-i18n-placeholder="monitor.gotoHint" value="$0600">
        </label>
        <select id="dis-labels" data-i18n-label="flow.pickLabel"></select>
        <button id="dis-prev" type="button" data-i18n-title="disasm.prev" data-i18n-label="disasm.prev">▲</button>
        <button id="dis-next" type="button" data-i18n-title="disasm.next" data-i18n-label="disasm.next">▼</button>
        <label class="field"><input id="dis-follow" type="checkbox"><span data-i18n="disasm.follow"></span></label>
      </div>
      <div id="disasm" class="mono flow" role="list"></div>
    </article>
    </div>
  </section>

  <div class="splitter" id="split-right" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-label="panel.resize"></div>
  <aside id="panel-right" class="side side-r" aria-labelledby="title-right">
    <div class="side-head">
      <button type="button" class="tog" data-toggle="right" data-i18n-title="panel.collapse" data-i18n-label="panel.collapse" aria-expanded="true">›</button>
      <h2 id="title-right" data-i18n="panel.reference"></h2>
    </div>
    <div class="side-body ref">
      <div class="ref-nav">
        <nav id="ref-links" class="ref-links">
          <a href="#ref-overview" data-target="overview" data-i18n="ref.nav.overview"></a>
          <a href="#ref-modes" data-target="modes" data-i18n="ref.nav.modes"></a>
          <a href="#ref-instr" data-target="instr" data-i18n="ref.nav.instr"></a>
          <a href="#ref-opcodes" data-target="opcodes" data-i18n="ref.nav.opcodes"></a>
        </nav>
        <input id="ref-search" type="search" spellcheck="false" autocomplete="off" data-i18n-placeholder="ref.search" data-i18n-label="ref.search">
      </div>
      <div id="ref-scroll" class="ref-scroll">
        <p id="ref-error" class="err-text" hidden data-i18n="ref.loadError"></p>
        <div id="ref-content"></div>
      </div>
    </div>
    <div class="rail-label" aria-hidden="true" data-i18n="panel.reference"></div>
  </aside>
</main>

<dialog id="about" aria-labelledby="about-title">
  <div class="about-head">
    <span id="about-title" class="muted">Easy 6502 Reloaded</span>
    <button id="about-close" type="button" data-i18n="about.close"></button>
  </div>
  <div id="about-body" class="prose"></div>
</dialog>

<footer class="statusbar"><span id="status"></span><span class="spacer"></span><span id="status-right" class="mono"></span></footer>
<noscript><p style="padding:16px;font-family:system-ui,sans-serif">Easy 6502 Reloaded needs JavaScript. / Easy 6502 Reloaded braucht JavaScript.</p></noscript>
</body>
</html>
