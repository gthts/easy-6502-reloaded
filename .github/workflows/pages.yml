name: Prüfen und veröffentlichen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Funktionstest von Klaus Dormann laden
        run: |
          curl -fsSL -o "$RUNNER_TEMP/6502_functional_test.bin" \
            https://raw.githubusercontent.com/Klaus2m5/6502_65C02_functional_tests/master/bin_files/6502_functional_test.bin
          test "$(stat -c %s "$RUNNER_TEMP/6502_functional_test.bin")" -eq 65536
      - name: Tests
        run: npm test
        env:
          DORMANN_BIN: ${{ runner.temp }}/6502_functional_test.bin

  deploy:
    # Nur nach einem Push auf main, und nur wenn die Tests bestanden sind
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Seite zusammenstellen
        run: node tools/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
